name: harden-den-44-policy

on:
  push:
    branches:
      - agent/den-44-app-vault-step-up-backend

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Enforce database-safe clocks and policy-specific proof lifetimes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/app_vault.rs")
          text = path.read_text()

          text = text.replace(
              "    DuplicateRecordClock,\n    SignatureRejected,\n",
              "    DuplicateRecordClock,\n    LogicalClockOutOfRange,\n    SignatureRejected,\n",
              1,
          )
          text = text.replace(
              "    ProofExpired,\n    ProofPredatesChallenge,\n",
              "    ProofExpired,\n    ProofLifetimeExceeded,\n    ProofPredatesChallenge,\n",
              1,
          )
          text = text.replace(
              '            Self::DuplicateRecordClock => "app-vault batch repeats a record clock",\n'
              '            Self::SignatureRejected => "cryptographic signature verification failed",\n',
              '            Self::DuplicateRecordClock => "app-vault batch repeats a record clock",\n'
              '            Self::LogicalClockOutOfRange => "app-vault logical clock exceeds PostgreSQL BIGINT",\n'
              '            Self::SignatureRejected => "cryptographic signature verification failed",\n',
              1,
          )
          text = text.replace(
              '            Self::ProofExpired => "external step-up proof has expired",\n'
              '            Self::ProofPredatesChallenge => "external step-up proof predates its challenge",\n',
              '            Self::ProofExpired => "external step-up proof has expired",\n'
              '            Self::ProofLifetimeExceeded => "external step-up proof exceeds local policy lifetime",\n'
              '            Self::ProofPredatesChallenge => "external step-up proof predates its challenge",\n',
              1,
          )

          duplicate_guard = """        if !record_clocks.insert((
                      mutation.namespace.as_str(),
                      mutation.opaque_record_id.as_str(),
                      mutation.source_device_id.as_str(),
                      mutation.logical_clock,
                  )) {
                      return Err(PolicyError::DuplicateRecordClock);
                  }
                  verifier.verify(mutation)?;
          """
          bounded_guard = """        if !record_clocks.insert((
                      mutation.namespace.as_str(),
                      mutation.opaque_record_id.as_str(),
                      mutation.source_device_id.as_str(),
                      mutation.logical_clock,
                  )) {
                      return Err(PolicyError::DuplicateRecordClock);
                  }
                  if mutation.logical_clock > i64::MAX as u64 {
                      return Err(PolicyError::LogicalClockOutOfRange);
                  }
                  verifier.verify(mutation)?;
          """
          if duplicate_guard in text:
              text = text.replace(duplicate_guard, bounded_guard, 1)
          elif "PolicyError::LogicalClockOutOfRange" not in text:
              raise SystemExit("mutation clock insertion point was not found")

          proof_times = """    let proof_issued_at = proof.issued_at.timestamp();
              let proof_expires_at = proof.expires_at.timestamp();
              let latest_allowed_issue_time = now_unix_seconds
          """
          proof_times_bounded = """    let proof_issued_at = proof.issued_at.timestamp();
              let proof_expires_at = proof.expires_at.timestamp();
              let proof_lifetime = proof_expires_at
                  .checked_sub(proof_issued_at)
                  .ok_or(PolicyError::InvalidProof)?;
              if proof_lifetime <= 0 || proof_lifetime > policy.max_lifetime_seconds {
                  return Err(PolicyError::ProofLifetimeExceeded);
              }
              let latest_allowed_issue_time = now_unix_seconds
          """
          if proof_times in text:
              text = text.replace(proof_times, proof_times_bounded, 1)
          elif "let proof_lifetime =" not in text:
              raise SystemExit("proof lifetime insertion point was not found")

          duplicate_test = """        assert_eq!(
                      validate_app_vault_push(
                          now,
                          THREE_FA_APP_ID,
                          &duplicates,
                          active_device(),
                          AppVaultPolicy::default(),
                          &AcceptSignatures,
                      ),
                      Err(PolicyError::DuplicateMutation)
                  );
              }
          """
          bounded_test = """        assert_eq!(
                      validate_app_vault_push(
                          now,
                          THREE_FA_APP_ID,
                          &duplicates,
                          active_device(),
                          AppVaultPolicy::default(),
                          &AcceptSignatures,
                      ),
                      Err(PolicyError::DuplicateMutation)
                  );

                  let out_of_range = push_request(vec![mutation(
                      "mutation-out-of-range",
                      "cliptown-device-a",
                      i64::MAX as u64 + 1,
                  )]);
                  assert_eq!(
                      validate_app_vault_push(
                          now,
                          THREE_FA_APP_ID,
                          &out_of_range,
                          active_device(),
                          AppVaultPolicy::default(),
                          &AcceptSignatures,
                      ),
                      Err(PolicyError::LogicalClockOutOfRange)
                  );
              }
          """
          if duplicate_test in text:
              text = text.replace(duplicate_test, bounded_test, 1)
          elif "mutation-out-of-range" not in text:
              raise SystemExit("app-vault bounds test insertion point was not found")

          verifier_test = """        assert_eq!(
                      validate_step_up_authorization(
                          now,
                          &request_context(),
                          &challenge(),
                          &proof,
                          active_device(),
                          StepUpPolicy::default(),
                          &RejectSignatures,
                      ),
                      Err(PolicyError::SignatureRejected)
                  );
              }
          """
          lifetime_test = """        assert_eq!(
                      validate_step_up_authorization(
                          now,
                          &request_context(),
                          &challenge(),
                          &proof,
                          active_device(),
                          StepUpPolicy::default(),
                          &RejectSignatures,
                      ),
                      Err(PolicyError::SignatureRejected)
                  );

                  let short_policy = StepUpPolicy {
                      max_lifetime_seconds: 60,
                      ..StepUpPolicy::default()
                  };
                  assert_eq!(
                      validate_step_up_authorization(
                          now,
                          &request_context(),
                          &challenge(),
                          &proof,
                          active_device(),
                          short_policy,
                          &AcceptSignatures,
                      ),
                      Err(PolicyError::ProofLifetimeExceeded)
                  );
              }
          """
          if verifier_test in text:
              text = text.replace(verifier_test, lifetime_test, 1)
          elif "let short_policy" not in text:
              raise SystemExit("step-up lifetime test insertion point was not found")

          path.write_text(text)
          Path(".github/workflows/harden-den-44-policy.yml").unlink()
          PY
          cargo fmt --all
          python3 scripts/check-security-schema.py
          git diff --check
      - name: Commit hardened policy
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "DEN-44 harden app-vault clocks and step-up lifetimes"
          git push origin "HEAD:${GITHUB_REF_NAME}"
