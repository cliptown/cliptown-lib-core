name: Apply DEN-1578 schema on PR once

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: apply-den-1578-schema-pr-once
  cancel-in-progress: false

jobs:
  apply:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'alexanderdmills/den-1578-implement-cliptown-backend-enforcement-for-memebank'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: alexanderdmills/den-1578-implement-cliptown-backend-enforcement-for-memebank
          fetch-depth: 0
          token: ${{ github.token }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply exact reviewed SQL and format Rust
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source_path = Path('.github/workflows/apply-den-1578-schema-once.yml')
          source = source_path.read_text(encoding='utf-8')
          prefix = "          block = r'''"
          start = source.index(prefix) + len(prefix)
          end = source.index("\n'''", start)
          block = source[start:end]

          schema_path = Path('schema/schema.sql')
          schema = schema_path.read_text(encoding='utf-8')
          marker = '-- BEGIN DEN-1578 MEMEBANK TRANSFER API'
          if marker in schema:
              raise SystemExit('DEN-1578 schema marker already exists')
          schema_path.write_text(schema.rstrip() + block + '\n', encoding='utf-8')
          PY

          git rm .github/workflows/apply-den-1578-schema-once.yml
          git rm .github/workflows/apply-den-1578-schema-pr-once.yml
          cargo fmt --all
          git diff --check
      - name: Validate schema boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          text = Path('schema/schema.sql').read_text(encoding='utf-8')
          section = text.split('-- BEGIN DEN-1578 MEMEBANK TRANSFER API', 1)[1]
          for required in [
              'CREATE TABLE IF NOT EXISTS cliptown.memebank_transfers',
              'CREATE TABLE IF NOT EXISTS cliptown.memebank_transfer_idempotency',
              'UNIQUE (subject_id, idempotency_key)',
              'ALTER TABLE cliptown.memebank_transfers ENABLE ROW LEVEL SECURITY',
              'ALTER TABLE cliptown.memebank_transfer_idempotency ENABLE ROW LEVEL SECURITY',
              'REVOKE ALL ON cliptown.memebank_transfers FROM PUBLIC',
              'REVOKE ALL ON cliptown.memebank_transfer_idempotency FROM PUBLIC',
          ]:
              if required not in section:
                  raise SystemExit(f'missing DEN-1578 invariant: {required}')
          PY
      - name: Commit and push validated desired state
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'feat(DEN-1578): add transfer tables, constraints, and RLS'
          git push origin HEAD:alexanderdmills/den-1578-implement-cliptown-backend-enforcement-for-memebank
