name: fix-den-44-policy-test

# One-shot branch workflow; it removes itself after committing the corrected fixture.
on:
  push:
    branches:
      - agent/den-44-app-vault-step-up-backend

permissions:
  contents: write

jobs:
  fix-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.88.0
          components: rustfmt
      - name: Keep the challenge valid while testing an overlong proof
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/app_vault.rs")
          text = path.read_text()
          old = '''        let short_policy = StepUpPolicy {
              max_lifetime_seconds: 60,
              ..StepUpPolicy::default()
          };
          assert_eq!(
              validate_step_up_authorization(
                  now,
                  &request_context(),
                  &challenge(),
                  &proof,
                  active_device(),
                  short_policy,
                  &AcceptSignatures,
              ),
              Err(PolicyError::ProofLifetimeExceeded)
          );
          '''
          new = '''        let short_policy = StepUpPolicy {
              max_lifetime_seconds: 60,
              ..StepUpPolicy::default()
          };
          let bounded_challenge = StepUpChallenge {
              created_at_unix_seconds: proof.issued_at.timestamp(),
              expires_at_unix_seconds: proof.issued_at.timestamp() + 60,
              ..challenge()
          };
          let overlong_proof = ExternalStepUpProof {
              issued_at: proof.issued_at - chrono::Duration::seconds(30),
              expires_at: proof.issued_at + chrono::Duration::seconds(60),
              ..proof.clone()
          };
          assert_eq!(
              validate_step_up_authorization(
                  now,
                  &request_context(),
                  &bounded_challenge,
                  &overlong_proof,
                  active_device(),
                  short_policy,
                  &AcceptSignatures,
              ),
              Err(PolicyError::ProofLifetimeExceeded)
          );
          '''
          if old not in text:
              raise SystemExit("short-policy test block was not found")
          path.write_text(text.replace(old, new, 1))
          Path(".github/workflows/fix-den-44-policy-test.yml").unlink()
          PY
          cargo fmt --all
          git diff --check
      - name: Commit corrected test fixture
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "DEN-44 test overlong proof against valid challenge"
          git push origin "HEAD:${GITHUB_REF_NAME}"
