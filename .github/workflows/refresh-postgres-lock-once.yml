name: refresh-postgres-only-lock-once

on:
  push:
    branches: [agent/den-344-agent-first-nix]
    paths:
      - Cargo.toml
      - .github/workflows/refresh-postgres-lock-once.yml

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out backend branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/den-344-agent-first-nix
          path: cliptown-rust-backend.rs
          fetch-depth: 0
      - name: Check out pinned interfaces
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: cliptown/cliptown-interfaces
          ref: e4e957b5372dc363fe6a52559c8959f0de781efb
          path: cliptown-interfaces
      - name: Set up Rust 1.88
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.88.0
      - name: Refresh and verify Postgres-only lock graph
        working-directory: cliptown-rust-backend.rs
        run: |
          cargo metadata --format-version 1 --no-deps >/dev/null
          if grep -Fq 'name = "sqlx-mysql"' Cargo.lock || grep -Fq 'name = "rsa"' Cargo.lock; then
            echo 'unused SQLx MySQL/RSA packages remain in the Postgres-only lock graph' >&2
            exit 1
          fi
          rm .github/workflows/refresh-postgres-lock-once.yml
      - name: Commit refreshed lockfile and remove maintenance workflow
        working-directory: cliptown-rust-backend.rs
        run: |
          git add Cargo.lock Cargo.toml .github/workflows/refresh-postgres-lock-once.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'DEN-347 refresh Postgres-only lock graph'
          git push origin HEAD:agent/den-344-agent-first-nix
