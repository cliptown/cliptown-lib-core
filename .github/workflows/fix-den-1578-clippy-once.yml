name: Fix DEN-1578 Clippy findings once

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

concurrency:
  group: fix-den-1578-clippy-once
  cancel-in-progress: false

jobs:
  fix:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'alexanderdmills/den-1578-implement-cliptown-backend-enforcement-for-memebank'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: alexanderdmills/den-1578-implement-cliptown-backend-enforcement-for-memebank
          fetch-depth: 0
          token: ${{ github.token }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply exact audited source fixes
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/memebank_transfer.rs')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  '    if !is_uuid(&transfer.transfer_id) || transfer.subject != authorized.subject {',
                  '    if !is_uuid(transfer.transfer_id) || transfer.subject != authorized.subject {',
              ),
              (
                  '    const DIGEST: &str = "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA";\n\n    fn claims',
                  '    const DIGEST: &str = "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA";\n    type ClaimMutation = Box<dyn Fn(&mut DelegatedAuthorization)>;\n\n    fn claims',
              ),
              (
                  '        let cases: Vec<Box<dyn Fn(&mut DelegatedAuthorization)>> = vec![',
                  '        let cases: Vec<ClaimMutation> = vec![',
              ),
          ]
          for old, new in replacements:
              observed = text.count(old)
              if observed != 1:
                  raise SystemExit(f'expected one exact match, found {observed}: {old!r}')
              text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')
          PY

          git rm .github/workflows/fix-den-1578-clippy-once.yml
          cargo fmt --all
          git diff --check
      - name: Commit and push audited fixes
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix(DEN-1578): clear audited Clippy findings'
          git push origin HEAD:alexanderdmills/den-1578-implement-cliptown-backend-enforcement-for-memebank
