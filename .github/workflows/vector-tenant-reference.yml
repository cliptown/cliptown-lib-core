name: vector-tenant-reference
on:
  pull_request:
    paths:
      - 'tests/vector_tenant_reference.py'
      - '.github/workflows/vector-tenant-reference.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: python3 tests/vector_tenant_reference.py
