name: Fix DEN-1578 wire format once

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

concurrency:
  group: fix-den-1578-wire-once
  cancel-in-progress: false

jobs:
  fix:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'alexanderdmills/den-1578-implement-cliptown-backend-enforcement-for-memebank'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: alexanderdmills/den-1578-implement-cliptown-backend-enforcement-for-memebank
          fetch-depth: 0
          token: ${{ github.token }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Pin exact API wire names and regression test
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/memebank_transfer.rs')
          text = path.read_text(encoding='utf-8')

          old_enum = '''#[derive(Debug, Clone, Copy, Serialize, Deserialize, PartialEq, Eq)]
          #[serde(rename_all = "kebab-case")]
          pub enum CipherAlgorithm {
              Xchacha20poly1305V1,
              Aes256GcmV1,
          }
          '''.replace('          ', '')
          new_enum = '''#[derive(Debug, Clone, Copy, Serialize, Deserialize, PartialEq, Eq)]
          pub enum CipherAlgorithm {
              #[serde(rename = "xchacha20poly1305-v1")]
              Xchacha20poly1305V1,
              #[serde(rename = "aes-256-gcm-v1")]
              Aes256GcmV1,
          }
          '''.replace('          ', '')
          if text.count(old_enum) != 1:
              raise SystemExit('expected exactly one CipherAlgorithm enum block')
          text = text.replace(old_enum, new_enum)

          anchor = '''    #[test]
              fn exact_delegated_scope_and_fresh_shared_auth_assurance_are_required() {
          '''.replace('              ', '    ')
          test = '''    #[test]
              fn cipher_algorithm_wire_names_match_the_openapi_contract() {
                  assert_eq!(
                      serde_json::to_string(&CipherAlgorithm::Xchacha20poly1305V1).unwrap(),
                      r#""xchacha20poly1305-v1""#
                  );
                  assert_eq!(
                      serde_json::to_string(&CipherAlgorithm::Aes256GcmV1).unwrap(),
                      r#""aes-256-gcm-v1""#
                  );
              }

          '''.replace('              ', '    ')
          if text.count(anchor) != 1:
              raise SystemExit('expected exactly one unit-test insertion anchor')
          path.write_text(text.replace(anchor, test + anchor), encoding='utf-8')
          PY

          git rm .github/workflows/fix-den-1578-wire-once.yml
          cargo fmt --all
          git diff --check
      - name: Commit and push validated wire fix
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix(DEN-1578): pin transfer cipher wire names'
          git push origin HEAD:alexanderdmills/den-1578-implement-cliptown-backend-enforcement-for-memebank
