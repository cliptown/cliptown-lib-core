name: Rust Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        toolchain: ['1.85.0', stable]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: cliptown-rust-backend.rs
      - uses: actions/checkout@v4
        with:
          repository: cliptown/cliptown-interfaces
          ref: main
          path: cliptown-interfaces
      - name: Set up Rust ${{ matrix.toolchain }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy
      - name: Reject generated and secret files
        working-directory: cliptown-rust-backend.rs
        run: |
          bad=$(git ls-files | grep -E '(^|/)(target/|\.direnv/|\.env$|result$)' || true)
          test -z "$bad" || { printf 'forbidden tracked files:\n%s\n' "$bad"; exit 1; }
      - name: Verify dependency graph
        working-directory: cliptown-rust-backend.rs
        run: cargo metadata --locked --format-version 1 --no-deps >/dev/null
      - name: Check formatting
        working-directory: cliptown-rust-backend.rs
        run: cargo fmt --check
      - name: Run Clippy
        id: clippy
        continue-on-error: true
        working-directory: cliptown-rust-backend.rs
        run: cargo clippy --locked --all-targets --message-format=short -- -D warnings > clippy-${{ matrix.toolchain }}.txt 2>&1
      - name: Upload Clippy diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-clippy-${{ matrix.toolchain }}
          path: cliptown-rust-backend.rs/clippy-${{ matrix.toolchain }}.txt
          if-no-files-found: error
      - name: Enforce Clippy result
        if: steps.clippy.outcome == 'failure'
        working-directory: cliptown-rust-backend.rs
        run: cat clippy-${{ matrix.toolchain }}.txt && exit 1
      - name: Run all-target tests
        working-directory: cliptown-rust-backend.rs
        env:
          RUST_BACKTRACE: '1'
        run: cargo test --locked --all-targets -- --nocapture
      - name: Build release binary
        working-directory: cliptown-rust-backend.rs
        run: cargo build --locked --release
