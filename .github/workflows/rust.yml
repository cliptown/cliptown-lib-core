name: Rust Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        toolchain: ['1.88.0', stable]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out backend
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: cliptown-rust-backend.rs
          persist-credentials: false
          show-progress: false
      - name: Check out pinned interfaces
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: cliptown/cliptown-interfaces
          ref: ef3d5f55719e56b1a6f11d2d6464c0976aa1863d
          path: cliptown-interfaces
          persist-credentials: false
          show-progress: false
      - name: Set up Rust ${{ matrix.toolchain }}
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy
      - name: Reject generated and secret files
        working-directory: cliptown-rust-backend.rs
        run: |
          bad=$(git ls-files | grep -E '(^|/)(target/|\.cache/|\.direnv/|\.env$|result$)' || true)
          test -z "$bad" || { printf 'forbidden tracked files:\n%s\n' "$bad"; exit 1; }
      - name: Verify dependency graph
        working-directory: cliptown-rust-backend.rs
        run: cargo metadata --locked --format-version 1 --no-deps >/dev/null
      - name: Enforce Postgres-only active dependency graph
        working-directory: cliptown-rust-backend.rs
        run: |
          for package in rsa sqlx-mysql sqlx-sqlite; do
            report=$(cargo tree --locked -e normal,build -i "$package" 2>&1 || true)
            if grep -Eq "^${package} v[0-9]" <<<"$report"; then
              printf '%s\n' "$report" >&2
              echo "forbidden package $package is reachable in the active Postgres dependency graph" >&2
              exit 1
            fi
          done
      - name: Validate app-vault security schema
        working-directory: cliptown-rust-backend.rs
        run: python3 scripts/check-security-schema.py
      - name: Check formatting
        working-directory: cliptown-rust-backend.rs
        run: cargo fmt --all --check
      - name: Run Clippy
        id: clippy
        continue-on-error: true
        working-directory: cliptown-rust-backend.rs
        run: cargo clippy --locked --all-targets --message-format=short -- -D warnings >clippy.txt 2>&1
      - name: Upload Clippy diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clippy-${{ matrix.toolchain }}
          path: cliptown-rust-backend.rs/clippy.txt
          if-no-files-found: error
      - name: Enforce Clippy result
        if: steps.clippy.outcome == 'failure'
        working-directory: cliptown-rust-backend.rs
        run: cat clippy.txt && exit 1
      - name: Run all-target tests
        working-directory: cliptown-rust-backend.rs
        env:
          RUST_BACKTRACE: '1'
        run: cargo test --locked --all-targets -- --nocapture
      - name: Build release binary
        working-directory: cliptown-rust-backend.rs
        run: cargo build --locked --release

# BEGIN DEN44 INTEGRITY FINALIZER
  finalize-integrity:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/den-44-app-vault-step-up-backend'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Apply final reviewed invariants
        run: |
          python3 scripts/finalize_den44_integrity.py
          python3 scripts/check-security-schema.py
          git diff --check
      - name: Commit final reviewed invariants
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "DEN-44 finalize app-vault and proof-consumption integrity"
          git push origin "HEAD:${{ github.head_ref }}"
# END DEN44 INTEGRITY FINALIZER
