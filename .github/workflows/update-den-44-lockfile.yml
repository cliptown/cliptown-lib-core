name: update-den-44-lockfile

on:
  push:
    branches:
      - agent/den-44-app-vault-step-up-backend

permissions:
  contents: write

jobs:
  update-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out backend
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: cliptown-rust-backend.rs
          fetch-depth: 0
      - name: Check out pinned interfaces
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: cliptown/cliptown-interfaces
          ref: ef3d5f55719e56b1a6f11d2d6464c0976aa1863d
          path: cliptown-interfaces
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy
      - name: Refresh only resolved dependency metadata
        working-directory: cliptown-rust-backend.rs
        shell: bash
        run: |
          set -euo pipefail
          cargo update -p sea-orm --precise 1.1.20
          cargo metadata --locked --format-version 1 --no-deps >/dev/null
          cargo fmt --all --check
          python3 scripts/check-security-schema.py
          git diff --check
          rm .github/workflows/update-den-44-lockfile.yml
      - name: Commit lockfile
        working-directory: cliptown-rust-backend.rs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock .github/workflows/update-den-44-lockfile.yml
          git commit -m "DEN-44 refresh lockfile for SeaORM JSON support"
          git push origin "HEAD:${GITHUB_REF_NAME}"
