name: DEN-3321 recovered hardening applicator

on:
  push:
    branches:
      - agent/json-schema-orm-core-20260809
    paths:
      - .github/workflows/den-3321-recovery-apply.yml

permissions:
  contents: write

concurrency:
  group: den-3321-recovery-apply-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify and apply recovered patch
        shell: bash
        run: |
          set -euo pipefail
          echo 'd55b44f75ff26831dbd860a4cd5b9253dab1540a67441cc04d95655d0b0b92da  .recovery/den-3321/cliptown-hardening.patch.gz.b64' | sha256sum -c -
          base64 --decode .recovery/den-3321/cliptown-hardening.patch.gz.b64 > /tmp/cliptown-hardening.patch.gz
          gzip -dc /tmp/cliptown-hardening.patch.gz > /tmp/cliptown-hardening.patch
          echo 'ea6e01c6862a50ed27ae69cb373c6b497f2b6e380c6c24c6ac2fbb378c51332a  /tmp/cliptown-hardening.patch' | sha256sum -c -
          git apply --check /tmp/cliptown-hardening.patch
          git apply /tmp/cliptown-hardening.patch

      - name: Validate schema ORM hardening
        shell: bash
        run: |
          set -euo pipefail
          node --version
          go version
          node --check tools/schema-orm-codegen.mjs
          node --check tools/schema-orm/core.mjs
          node --check tools/schema-orm/sql.mjs
          node --test tests/schema-orm-codegen.test.mjs
          node tools/schema-orm-codegen.mjs
          node tools/schema-orm-codegen.mjs --check
          bash tests/check-generated-go.sh

      - name: Commit validated recovery and remove bootstrap files
        shell: bash
        run: |
          set -euo pipefail
          git rm .recovery/den-3321/cliptown-hardening.patch.gz.b64
          git rm .github/workflows/den-3321-recovery-apply.yml
          git add generated/manifest.json tests/schema-orm-codegen.test.mjs tools/schema-orm-codegen.mjs tools/schema-orm/core.mjs tools/schema-orm/sql.mjs
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(DEN-3321): harden schema ORM generation'
          git push origin "HEAD:${GITHUB_REF_NAME}"
