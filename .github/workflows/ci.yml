name: ci

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install pinned toolchain
        run: rustup toolchain install 1.88.0 --profile minimal --component clippy,rustfmt

      - name: Verify locked dependencies
        run: test -f Cargo.lock && cargo +1.88.0 fetch --locked

      - name: Format
        run: cargo +1.88.0 fmt --all -- --check

      - name: Test
        run: cargo +1.88.0 test --locked --all-targets

      - name: Clippy
        run: cargo +1.88.0 clippy --locked --all-targets -- -D warnings

      - name: Documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo +1.88.0 doc --locked --no-deps

      - name: Verify clean source tree
        run: git diff --exit-code
