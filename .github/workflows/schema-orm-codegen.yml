name: schema ORM codegen

on:
  pull_request:
    paths:
      - schema/**
      - tools/schema-orm-codegen.mjs
      - tools/schema-orm/**
      - tests/**
      - generated/**
      - package.json
      - build.yaml
      - .github/workflows/schema-orm-codegen.yml
  push:
    branches: [main]
    paths:
      - schema/**
      - tools/schema-orm-codegen.mjs
      - tools/schema-orm/**
      - tests/**
      - generated/**
      - package.json
      - build.yaml
      - .github/workflows/schema-orm-codegen.yml

permissions:
  contents: read

concurrency:
  group: schema-orm-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generated-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          show-progress: false

      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.23.x'

      - name: Test generator and product invariants
        run: npm test

      - name: Verify generated tree
        run: npm run generate:check

      - name: Compile generated Go syntax without network dependencies
        run: bash tests/check-generated-go.sh

      - name: Verify canonical Go formatting
        run: test -z "$(gofmt -d generated/go/gorm/models.go generated/shared/go/entity_descriptors.go)"
