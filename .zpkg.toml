[package]
org = "cliptown"
name = "cliptown-lib-core"
version = "0.1.0"
description = "Transport-neutral ClipTown domain, authorization, encrypted-object, and sync invariants"
license = "MIT"
keywords = ["clipboard", "encryption", "sync", "authorization"]

[package.repository]
vcs = "git"
url = "https://github.com/cliptown/cliptown-lib-core"

[dependencies]
"oresoftware/ores-locks-and-leases" = "=0.1.1"
"cliptown/cliptown-interfaces" = "^0.1.0"

[install]
dir = ".vendor/.zed"

[targets.rust]
dir = "."
adapter = "rust"

# The org's lock routines: ORESoftware/ores-locks-and-leases wrapped with
# this org's key prefix and catalog. Nested zed package; see locks/README.md.
[targets.locks]
dir = "locks"
name = "cliptown-locks"
adapter = "none"

[publish]
include_readme = true
tag_format = "v{version}"
smoke_test = "cargo test --manifest-path \"$ZED_PKG_TEST_TARGET/Cargo.toml\" --locked --all-targets"
exclude = [".env", ".env.*", ".vendor/.zed/**", ".zed/**", ".zed-pack/**", "target/**", "**/target/**", "**/node_modules/**", "**/*.log", ".DS_Store"]

[scripts]
test = "cargo fmt --all -- --check && cargo test --locked --all-targets && cargo clippy --locked --all-targets -- -D warnings"
