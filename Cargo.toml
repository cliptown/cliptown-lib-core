[package]
name = "cliptown-lib-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
description = "Transport-neutral ClipTown domain, authorization, encrypted-object, and sync invariants"
repository = "https://github.com/cliptown/cliptown-lib-core"
keywords = ["clipboard", "encryption", "sync", "authorization"]
categories = ["data-structures", "cryptography"]

[features]
default = ["read-only"]
read-only = []
read-write = ["read-only"]

[dependencies]
base64 = "0.22.1"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
thiserror = "2.0.12"
uuid = { version = "1.17.0", features = ["serde", "v4"] }

# --- functional programming conformance -------------------------------------
# Warn level only: these never fail a build. They fail `cargo clippy -- -D warnings`
# in the nightly job. See FP-GUIDELINES.md for the principle behind each group.

[lints.rust]
unsafe_code = "warn"
unused_must_use = "deny"
unreachable_pub = "warn"

[lints.clippy]
# typed errors: panicking is not error handling
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
indexing_slicing = "warn"
# illegal states excluded by types
wildcard_enum_match_arm = "warn"
match_wildcard_for_single_variants = "warn"
# immutable values and pure transformations
mut_mut = "warn"
needless_pass_by_ref_mut = "warn"
# composition
too_many_lines = "warn"
cognitive_complexity = "warn"
module_name_repetitions = "allow"
# explicit inputs and outputs
must_use_candidate = "warn"
return_self_not_must_use = "warn"
